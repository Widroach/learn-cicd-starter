name: cd

on:
    push:
        branches: [main]

    workflow_dispatch:

jobs:
    deploy:
    
        permissions:
          contents: 'read'
          id-token: 'write'
        
        name: Deploy
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.26.0"
                  
            - name: Build App
              run: scripts/buildprod.sh

            - name: Authenticate to GCP
              uses: 'google-github-actions/auth@v2'
              with:
                  credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

            - name: 'Set up Cloud SDK'
              uses: 'google-github-actions/setup-gcloud@v3'
              with:
                version: '>= 363.0.0'

            - name: Upload image to AR
              run: | 
                  gcloud builds submit \
                      --tag us-central1-docker.pkg.dev/notely-502418/notely-ar-repo/notely:latest \
                      --service-account="projects/notely-502418/serviceAccounts/cloud-run-deployer@notely-502418.iam.gserviceaccount.com" \
                      --default-buckets-behavior="regional-user-owned-bucket" .
                      
            - name: Deploy to Cloud Run
              run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-502418/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-502418 --max-instances=4
